# 繁體中文摘要設定（C 階段）。改了指示內容要同步更新 prompt_version，快取才會重新產生。
prompt_version = "c1"
# 使用完整模型名稱（簡寫 haiku／sonnet 可能對應到舊版）
model = "claude-opus-5-5"
effort = "low"

# 預算
max_calls_per_run = 15       # 每天最多呼叫幾次（精選一天只產生一次）
max_attempts_per_repo = 2    # 每個專案最多試幾次（第 2 次會附上前一次的問題）
call_timeout_seconds = 180
total_timeout_seconds = 600
readme_max_chars = 12000

# 成功率低於這個比例，workflow 會發出失敗通知
alert_below_success_rate = 0.8

# 只存在簡體中文的字（繁體不會用到）
simplified_chars = "这们个为时说对会过还发经产让体点开关务问应简见现从书电长门马车东页网数据资讯认识设计总统档络级线链构项员帮实际运动变选显种类码单双头带质优处库图层测试读写杂历语请环习视频软适户该无与将进样么极节术执协议仓储并"

