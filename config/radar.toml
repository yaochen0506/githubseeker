# 繁體中文 GitHub 熱門專案雷達：A 階段（每日收集）設定

# 如實標示身分，不偽裝成瀏覽器（稽核報告 C-05）
user_agent = "githubseeker-radar/0.1 (+https://github.com/yaochen0506/githubseeker)"

# Trending 回 200 但少於這個列數，視為來源失敗（版型可能改變），不當成空榜
min_rows = 5
# 兩次抓取 Trending 頁面之間的間隔秒數
page_delay_seconds = 2
# 每次執行最多呼叫幾次 GitHub REST API（GITHUB_TOKEN 上限是每小時 1,000 次）
max_rest_requests = 700
# 遇到限流時最多等幾秒；超過就放棄剩下的請求，留給下一次觸發
max_rate_wait_seconds = 90

# 必抓 8 頁：全站、Python、TypeScript、中文專案 × 日榜、週榜（失敗就算這次收集不完整）
[[trending]]
id = "all-daily"
path = "/trending"
period = "daily"

[[trending]]
id = "all-weekly"
path = "/trending"
period = "weekly"

[[trending]]
id = "python-daily"
path = "/trending/python"
period = "daily"

[[trending]]
id = "python-weekly"
path = "/trending/python"
period = "weekly"

[[trending]]
id = "typescript-daily"
path = "/trending/typescript"
period = "daily"

[[trending]]
id = "typescript-weekly"
path = "/trending/typescript"
period = "weekly"

[[trending]]
id = "zh-daily"
path = "/trending"
period = "daily"
spoken_language = "zh"

[[trending]]
id = "zh-weekly"
path = "/trending"
period = "weekly"
spoken_language = "zh"

# 2026-11-25 加入：30 天冷卻後候選不夠，多抓 6 種語言 × 日榜、週榜。
