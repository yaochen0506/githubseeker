name: 每日收集

# 排程器實測常延遲 3.5～9 小時，所以一天設 3 個觸發；
# 當天已有完整紀錄時，後面的觸發會直接結束（冪等）。
on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Asia/Taipei"
    - cron: "17 6 * * *"
      timezone: "Asia/Taipei"
    - cron: "17 10 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      force:
        description: "今天已有完整紀錄也重新收集"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    # 這個 job 處理外部網頁與 API 資料，只給讀取權限
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
      run_id: ${{ steps.collect.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 取出資料分支（唯讀）
        run: |
          if git ls-remote --exit-code --heads origin radar-data > /dev/null; then
            git clone --quiet --depth 1 --branch radar-data "https://github.com/${GITHUB_REPOSITORY}.git" data
          else
            echo "資料分支還不存在，從空白開始"
            mkdir data
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 收集
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_SCHEDULE: ${{ github.event.schedule }}
          RADAR_FORCE: ${{ inputs.force }}
        run: python -m radar collect --data-dir data --out-dir out

      - if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-out
          path: out/
          retention-days: 7

  persist:
    # 只執行我們自己的程式：驗證產物後提交到資料分支
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radar-out
          path: out

      - name: 驗證產物
        run: python -m radar validate out

      - name: 提交到資料分支
        env:
          RUN_ID: ${{ needs.collect.outputs.run_id }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin radar-data > /dev/null; then
            git fetch --quiet origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            git worktree add -B radar-data data origin/radar-data
          else
            git worktree add --orphan -b radar-data data
          fi
          cp -r out/. data/
          cd data
          git add -A
          git commit --quiet -m "data: ${RUN_ID}"
          for attempt in 1 2 3; do
            git push --quiet origin radar-data && exit 0
            echo "推送失敗，第 ${attempt} 次重試"
            git pull --quiet --rebase origin radar-data
          done
          exit 1

  heartbeat:
    # 公開儲存庫 60 天沒有活動，排程會被停用；主分支超過 25 天沒有提交就補一個心跳提交
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 每月心跳提交
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -lt 25 ]; then
            echo "主分支 ${age_days} 天前有提交，不需要心跳"
            exit 0
          fi
          TZ=Asia/Taipei date '+%Y-%m-%d %H:%M (Asia/Taipei)' > .github/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit --quiet -m "chore: 每月心跳，維持排程啟用"
          git push --quiet
