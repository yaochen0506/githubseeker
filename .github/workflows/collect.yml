name: 每日收集與發布

# 排程器實測常延遲 3.5～9 小時，所以一天設 3 個觸發；
# 當天已有完整紀錄與精選時，後面的觸發只做部署檢查（冪等）。
on:
  schedule:
    - cron: "17 2 * * *"
      timezone: "Asia/Taipei"
    - cron: "17 6 * * *"
      timezone: "Asia/Taipei"
    - cron: "17 10 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      force:
        description: "今天已有完整紀錄也重新收集"
        type: boolean
        default: false
      skip_deploy:
        description: "只提交資料、不部署網站（演練恢復流程用）"
        type: boolean
        default: false
      summary_test:
        description: "只測試摘要權杖能不能用（不收集、不改資料）"
        type: boolean
        default: false
  # 網站程式或範本有改動時，只重新部署，不收集
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "site/**"
      - "config/site.toml"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

permissions: {}

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    # 這個 job 處理外部網頁與 API 資料，只給讀取權限
    if: github.event_name != 'push' && inputs.summary_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # 只傳「有沒有設定權杖」，權杖本身只在寫摘要那一步提供
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    outputs:
      changed: ${{ steps.edition.outputs.changed }}
      message: ${{ steps.edition.outputs.message }}
      summary_alert: ${{ steps.edition.outputs.summary_alert }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 取出資料分支（唯讀）
        run: |
          if git ls-remote --exit-code --heads origin radar-data > /dev/null; then
            git clone --quiet --depth 1 --branch radar-data "https://github.com/${GITHUB_REPOSITORY}.git" data
          else
            echo "資料分支還不存在，從空白開始"
            mkdir data
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 收集
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_SCHEDULE: ${{ github.event.schedule }}
          RADAR_FORCE: ${{ inputs.force }}
        run: python -m radar collect --data-dir data --out-dir out

      - name: 安裝 Claude Code（寫摘要用，固定版本）
        if: env.HAS_CLAUDE_TOKEN == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.308

      - name: 產生精選與中文摘要
        id: edition
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_SCHEDULE: ${{ github.event.schedule }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: python -m radar edition --data-dir data --out-dir out

      - if: steps.edition.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-out
          path: out/
          retention-days: 7

  persist:
    # 只執行我們自己的程式：驗證產物後提交到資料分支。提交成功，精選就是正式版
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radar-out
          path: out

      - name: 驗證產物
        run: python -m radar validate out

      - name: 提交到資料分支
        env:
          COMMIT_MESSAGE: ${{ needs.collect.outputs.message }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin radar-data > /dev/null; then
            git fetch --quiet origin +refs/heads/radar-data:refs/remotes/origin/radar-data
            git worktree add -B radar-data data origin/radar-data
          else
            git worktree add --orphan -b radar-data data
          fi
          cp -r out/. data/
          cd data
          git add -A
          git commit --quiet -m "${COMMIT_MESSAGE}"
          for attempt in 1 2 3; do
            git push --quiet origin radar-data && exit 0
            echo "推送失敗，第 ${attempt} 次重試"
            git pull --quiet --rebase origin radar-data
          done
          exit 1

  site-check:
    # 線上網站的「精選版本＋程式版本」和資料分支、main 不一致，才需要部署
    needs: [collect, persist]
    if: always() && !cancelled() && needs.collect.result != 'failure' && needs.persist.result != 'failure' && inputs.skip_deploy != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs_deploy: ${{ steps.check.outputs.needs_deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 取出資料分支（唯讀）
        run: |
          if git ls-remote --exit-code --heads origin radar-data > /dev/null; then
            git clone --quiet --depth 1 --branch radar-data "https://github.com/${GITHUB_REPOSITORY}.git" data
          else
            mkdir data
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - id: check
        run: python -m radar site-check --data-dir data

  deploy:
    needs: site-check
    # 推送觸發時 collect／persist 會跳過；不加 always() 的話，跳過會沿著依賴鏈傳下來，部署也被跳過
    if: always() && !cancelled() && needs.site-check.result == 'success' && needs.site-check.outputs.needs_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 取出資料分支（唯讀）
        run: |
          if git ls-remote --exit-code --heads origin radar-data > /dev/null; then
            git clone --quiet --depth 1 --branch radar-data "https://github.com/${GITHUB_REPOSITORY}.git" data
          else
            mkdir data
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: 從資料分支重建網站
        run: python -m radar build-site --data-dir data --out-dir _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: 確認線上已是最新版
        run: python -m radar site-verify --data-dir data

  summary-test:
    if: github.event_name == 'workflow_dispatch' && inputs.summary_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: npm install --global @anthropic-ai/claude-code@2.1.308

      - name: 測試摘要權杖
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: python -m radar summary-test

  summary-alert:
    # 摘要成功率過低時讓 workflow 標示失敗，GitHub 會寄信通知（資料與網站照常發布）
    needs: [collect, deploy]
    if: always() && needs.collect.outputs.summary_alert == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: |
          echo "::error::今天的中文摘要成功率過低。請查看 collect job「產生精選與中文摘要」的紀錄；常見原因是權杖過期（一年效期）或訂閱額度用完。"
          exit 1

  heartbeat:
    # 公開儲存庫 60 天沒有活動，排程會被停用；主分支超過 25 天沒有提交就補一個心跳提交
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 每月心跳提交
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age_days" -lt 25 ]; then
            echo "主分支 ${age_days} 天前有提交，不需要心跳"
            exit 0
          fi
          TZ=Asia/Taipei date '+%Y-%m-%d %H:%M (Asia/Taipei)' > .github/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit --quiet -m "chore: 每月心跳，維持排程啟用"
          git push --quiet
